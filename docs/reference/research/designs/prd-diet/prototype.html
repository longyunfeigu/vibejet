<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食衡 方向原型</title>
<style>
:root{
  --paper:#F7F4EC; --sheet:#FFFDF8; --card:#FFFFFF; --ink:#2A2620; --ink-2:#5E584D; --ink-3:#8C8577;
  --line:#E6E0D3; --line-2:#F0ECE2;
  --sage:#4F6B4A; --sage-2:#EEF3EA; --sage-3:#A9BE9F;
  --amber:#8A5A1A; --amber-2:#F6EBD6; --amber-3:#D9B57C;
  --clay:#A2543A; --clay-2:#F5E4DC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.65 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.top{max-width:980px;margin:0 auto;padding:24px 16px 8px}
.q{font-size:13.5px;color:var(--ink-2)}
.q b{color:var(--ink)}
.tags{font-size:12px;color:var(--ink-3);margin-top:4px}
.switch{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.switch button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.switch button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.switch button.picked::after{content:" ✓ 已选";font-size:11.5px}
.grid{max-width:980px;margin:0 auto;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.thesis{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.thesis h2{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:22px;margin:0 0 4px;font-weight:600}
.thesis .one{font-size:15px;color:var(--ink);margin:6px 0 12px}
.thesis dl{margin:0}
.thesis dt{font-size:12px;letter-spacing:.06em;color:var(--ink-3);margin-top:10px}
.thesis dd{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.thesis .how{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-3)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ctrl button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.ctrl button.on{background:var(--clay-2);border-color:#E8CBBE;color:var(--clay)}
.ctrl button.pick{background:var(--sage);border-color:var(--sage);color:#F4F1E8}
.appwrap{position:sticky;top:16px}
@media (max-width:900px){.appwrap{position:static}}
.app{background:#FBF9F4;border:1px solid var(--line);border-radius:20px;min-height:640px;max-height:760px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;font-size:12px;color:var(--ink-3)}
.bar b{color:var(--ink-2);font-weight:600}
.view{flex:1;padding:4px 16px 16px;overflow-y:auto}
.h{font-size:20px;font-weight:600;margin:6px 0 0}
.sub{font-size:12.5px;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:14px;margin:12px 0}
.big{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:400;color:var(--ink-3)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--sage);color:#F4F1E8;font-weight:600;padding:13px;cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--sage-2);color:var(--sage)}
.btn.huge{padding:26px 12px;font-size:19px;border-radius:18px}
.chip{display:inline-block;font-size:11.5px;border-radius:999px;padding:3px 9px}
.chip.ok{background:var(--sage-2);color:var(--sage)}.chip.hi{background:var(--amber-2);color:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer}
.tile b{display:block;font-size:13.5px}.tile span{font-size:11.5px;color:var(--ink-3)}
.item{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line-2);font-size:13px;color:var(--ink-2)}
.item:first-child{border-top:0}
.x{border:0;background:none;color:#B5AFA2;cursor:pointer;font-size:12.5px}
.empty{color:#A29C8F;font-size:12.5px;padding:4px 0}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.cand input[type=checkbox]{width:18px;height:18px;accent-color:var(--sage)}
.cand .nm{flex:1}.cand .nm small{display:block;color:var(--ink-3);font-size:12px}
.cand input[type=number]{width:62px;border:1px solid var(--line);border-radius:8px;padding:5px;text-align:right}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:10px 0}
.search input{border:0;outline:0;flex:1;background:none}
.food{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:14px}
.food span{color:var(--ink-3);font-size:12.5px}
.mini{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:12px;position:relative}
.mini i{flex:1;border-radius:4px 4px 1px 1px;background:var(--sage-3)}
.mini i.over{background:var(--amber-3)}.mini i.miss{background:none;border:1px dashed #C9C3B6;height:6px!important}
.mini .tl{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-3)}
.days{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.days span{flex:1;text-align:center}
.dots{display:flex;gap:6px;margin:10px 0 2px}
.dots span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-3)}
.dots b{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:50%;background:#7E9A73}
.dots b.miss{background:none;border:1.5px dashed #C9C3B6}.dots b.today{background:#fff;border:2px solid #7E9A73}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.meals button{border:0;border-radius:12px;padding:12px 0;background:#F3F0E7;color:var(--ink-3);cursor:pointer;font-size:13px}
.meals button.done{background:var(--sage-2);color:var(--sage);font-weight:600}
.band .track{height:8px;border-radius:8px;background:linear-gradient(90deg,#EFEBE2 0 62%,#DDE7D6 62% 100%);position:relative;margin:8px 0 4px}
.band .dot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--sage);transform:translateX(-50%)}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.msg{max-width:86%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--sage);color:#F4F1E8;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg .parsed{margin:8px 0 4px;border-top:1px dashed var(--line-2);padding-top:6px}
.msg .parsed div{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);padding:2px 0}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .acts button{border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;background:var(--sage-2);color:var(--sage)}
.msg .acts button.primary{background:var(--sage);color:#F4F1E8}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2);background:#FBF9F4}
.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.composer button{border:0;border-radius:12px;background:var(--sage);color:#F4F1E8;padding:0 16px;cursor:pointer}
.plate{display:flex;gap:16px;align-items:center}
.plate svg{flex:0 0 120px}
.legend{font-size:12.5px;color:var(--ink-2);line-height:1.9}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cat{border:1px solid var(--line-2);background:var(--card);border-radius:14px;padding:10px 12px}
.cat b{font-size:14px}
.cat small{display:block;color:var(--ink-3);font-size:11.5px;margin:2px 0 6px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.step span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#3A3630;color:#F4F1E8;border-radius:10px;padding:9px 14px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.on{opacity:1}
.tag{position:absolute;top:10px;right:12px;font-size:10.5px;background:#F0ECE2;color:var(--ink-3);border-radius:6px;padding:2px 6px}
.modal{position:fixed;inset:0;background:rgba(40,35,25,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal-box{background:var(--sheet);border-radius:14px;padding:16px;max-width:460px;width:100%}
.modal-box textarea{width:100%;height:200px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.modal-box .row{justify-content:flex-end;margin-top:10px}
.modal-box button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="q">这批原型要回答的问题：<b>食衡应该往哪个方向做？</b>五个方向押的东西不一样，每个都能从头点到尾。<b>已选定：4 对话式记录（2026-11-12）</b>，其余保留作记录。</div>
  <div class="tags">临时视觉 · 模拟数据 · 手机浏览器优先（单列宽度），电脑布局待定主设备后另做 · 食衡 PRD §7</div>
  <div class="switch" id="switch"></div>
</div>
<div class="grid">
  <div>
    <div class="thesis" id="thesis"></div>
    <div class="ctrl" id="ctrl">
      <button data-c="reset">重置这个方向</button>
      <button data-c="over">让今天超标</button>
      <button data-c="empty">清空今天</button>
      <button data-c="fail" id="c-fail">识别失败模式：关</button>
      <button data-c="pick" class="pick" id="c-pick">选这个方向</button>
      <button data-c="copy">复制为 prompt</button>
    </div>
  </div>
  <div class="appwrap"><div class="app" id="app"><div class="bar"><span>11月12日 周四</span><b>食衡</b><span class="tag" style="position:static">临时视觉</span></div><div class="view" id="view"></div><div id="dock"></div><div class="toast" id="toast"></div></div></div>
</div>
<div class="modal" id="modal"><div class="modal-box"><div style="font-size:13px;color:var(--ink-2);margin-bottom:8px">把下面这段贴回对话，写上你的判断：</div><textarea id="prompt-out"></textarea><div class="row"><button id="m-copy">复制</button><button id="m-close">关闭</button></div></div></div>

<script>
// ---------- shared mock data: [name, kcal per 100 g, default grams, unit] (illustrative only) ----------
const FOODS={rice:['米饭',116,150,'碗'],hmj:['黄焖鸡',150,300,'外卖一份'],greens:['清炒青菜',60,200,'份'],bread:['全麦面包',246,70,'两片'],
 milk:['牛奶',54,250,'盒'],egg:['鸡蛋',144,50,'个'],latte:['拿铁',55,350,'大杯'],apple:['苹果',53,200,'个'],nrm:['牛肉面',120,500,'碗'],
 yogurt:['无糖酸奶',72,200,'杯'],chicken:['鸡胸肉',133,150,'份'],mlt:['麻辣烫',95,450,'碗'],hotpot:['火锅（牛肉+蔬菜+粉）',120,700,'人份'],tea:['奶茶（半糖）',60,500,'杯']};
const kc=(id,g)=>Math.round(FOODS[id][1]*(g??FOODS[id][2])/100);
const TARGET=1360, DAYS=['周五','周六','周日','周一','周二','周三','今天'], PAST=[1250,1180,1790,0,1650,1100];
const $=id=>document.getElementById(id);
let failMode=false, picked='chat', D, S={}; // 2026-11-12 用户选定：对话式记录
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),2400)}
const sum=a=>a.reduce((x,y)=>x+y,0);
const breakfast=()=>[{id:'bread',g:70},{id:'milk',g:250},{id:'egg',g:50}];
const MEALNAME={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'};

// ---------- the five directions ----------
const DIRS={
snap:{name:'极速记录',one:'一切围绕"10 秒记完一餐"。',
 bet:'放弃的头号原因是记录太麻烦。只要记一餐比发一条消息还快，人就能坚持。首页就是一个大拍照按钮和"常吃"一键加。',
 cost:'反馈很少，只告诉你今天还能吃多少；不帮人理解一周的趋势，单日超标照样打击人。',
 fit:'已经知道自己该吃多少、只差一个顺手记录工具的人。',
 how:'点"拍一下"走识别；或者点"常吃"的方块一键记下。打开识别失败模式，看失败后怎么走。',
 init:()=>({log:breakfast(),mode:'home'}),
 render(){if(S.mode==='cand')return candView();if(S.mode==='search')return searchView();
  const t=sum(S.log.map(i=>kc(i.id,i.g))),left=TARGET-t;
  return `<div class="h">今天</div><div class="sub">${left>=0?`还能吃 <b style="color:var(--ink)">${left.toLocaleString()}</b> 千卡`:`超出 <b style="color:var(--amber)">${(-left).toLocaleString()}</b> 千卡`} · 已吃 ${t.toLocaleString()}</div>
  <button class="btn huge" data-a="snap">📷 拍一下，10 秒记完</button>
  <div class="sub" style="margin-top:16px">常吃 · 点一下就记下（份量用上次的）</div>
  <div class="tiles" style="margin-top:6px">${['hmj','rice','latte','nrm','apple','yogurt'].map(id=>`<button class="tile" data-a="quick:${id}"><b>${FOODS[id][0]}</b><span>${FOODS[id][3]} · ${kc(id)} 千卡</span></button>`).join('')}</div>
  <div class="card"><div class="sub" style="margin-bottom:4px">今天记了 ${S.log.length} 样</div>${S.log.length?S.log.map((i,ix)=>`<div class="item"><span>${FOODS[i.id][0]}</span><span>${kc(i.id,i.g)} 千卡 <button class="x" data-a="del:${ix}">撤销</button></span></div>`).join(''):'<div class="empty">还没记。拍一下，或者点上面的常吃。</div>'}</div>`}},
week:{name:'宽容回顾',one:'看周，不看天。',
 bet:'单日数字最打击人：某天吃多了满屏警告，人就放弃了。主视图改成近 7 天平均，只要一周整体在轨道上就算成功，体重也只看 7 天平均线。',
 cost:'想精确控制每一餐的人会觉得信息绕了一层；记录本身没有变轻。',
 fit:'容易因为一天吃多就自责放弃的人。',
 how:'先看首页的近 7 天卡片；点"让今天超标"看超标那天它说什么；点卡片进近 7 天详情。',
 init:()=>({log:breakfast(),mode:'home'}),
 render(){if(S.mode==='search')return searchView();if(S.mode==='detail')return weekDetail();
  const t=sum(S.log.map(i=>kc(i.id,i.g))),vals=[...PAST,t],rec=vals.filter(v=>v>0),avg=Math.round(sum(rec)/rec.length),on=avg<=TARGET,max=Math.max(...vals,TARGET)*1.15;
  return `<div class="h">近 7 天</div><div class="sub">11月6日 – 11月12日</div>
  <div class="card" data-a="detail" style="cursor:pointer"><div class="sub">近 7 天平均</div><div class="big">${avg.toLocaleString()} <small>/ 目标 ${TARGET.toLocaleString()} 千卡</small></div>
  <span class="chip ${on?'ok':'hi'}">${on?'这周在轨道上':'这周略高 '+(avg-TARGET)+' 千卡'}</span>
  <div class="mini"><div class="tl" style="bottom:${TARGET/max*56}px"></div>${vals.map(v=>`<i class="${v===0?'miss':v>TARGET?'over':''}" style="height:${v/max*56}px"></i>`).join('')}</div>
  <div class="days">${DAYS.map((d,i)=>`<span>${vals[i]===0?'未记':d}</span>`).join('')}</div></div>
  <div class="card"><div class="row"><span>今天已吃 ${t.toLocaleString()} 千卡</span><span class="sub">${t>TARGET?'超出 '+(t-TARGET)+'，按周来看就好':'还能吃 '+(TARGET-t)}</span></div>
  ${S.log.map(i=>`<div class="item"><span>${FOODS[i.id][0]}</span><span>${kc(i.id,i.g)} 千卡</span></div>`).join('')||'<div class="empty">今天还没记</div>'}</div>
  <button class="btn ghost" data-a="search">＋ 记一餐</button>`}},
habit:{name:'习惯养成',one:'先坚持，再精确。',
 bet:'问题不是算不准，而是坚持不下去。首页只问"今天几餐记了、这周记了几天"，热量只给一个大致范围；漏记一天不惩罚，连续记录才是主角。',
 cost:'热量反馈变模糊，减重速度可能变慢；需要精确数字的人会不满足。',
 fit:'试过好几个记录 App、都没坚持过三周的人。',
 how:'点四个餐次按钮记录，看打卡点和连续天数怎么变；点"清空今天"，看还没记时它说什么。',
 init:()=>({log:{breakfast:breakfast(),lunch:[],dinner:[],snack:[]},mode:'home',meal:null}),
 render(){if(S.mode==='quick')return habitQuick();
  const all=Object.values(S.log).flat(),t=sum(all.map(i=>kc(i.id,i.g))),todayOn=all.length>0,vals=[...PAST,todayOn?1:0],rec=vals.filter(v=>v>0).length;
  let k=0;for(let i=vals.length-1;i>=0;i--){if(vals[i]>0)k++;else if(i<vals.length-1)break}
  const pct=Math.min(t/TARGET,1.3)/1.3*100,label=t===0?'今天还没记，记一餐就算数':t<=TARGET*.7?'今天吃得还少，记得好好吃饭':t<=TARGET?'今天在建议范围内':'今天偏多一点，没关系，明天照常记';
  return `<div class="h">这周的坚持</div><div class="sub">记一餐就算数，不求精确</div>
  <div class="card"><div class="big">${rec} <small>/ 7 天有记录 · 连续 ${k} 天</small></div>
  <div class="dots">${DAYS.map((d,i)=>`<span><b class="${i===6?(todayOn?'':'today'):vals[i]===0?'miss':''}"></b>${d}</span>`).join('')}</div></div>
  <div class="sub">今天</div><div class="meals">${Object.keys(MEALNAME).map(m=>`<button class="${S.log[m].length?'done':''}" data-a="meal:${m}">${S.log[m].length?'✓ ':'＋ '}${MEALNAME[m]}</button>`).join('')}</div>
  <div class="card band"><div>${label}</div><div class="track"><div class="dot" style="left:${pct}%"></div></div><div class="sub">绿色区间是建议范围 · 已吃约 ${Math.round(t/100)*100} 千卡</div></div>`}},
chat:{name:'对话式记录',one:'说一句话就记完。',
 bet:'比拍照和搜索更轻的是说话："中午吃了黄焖鸡，饭吃了一半。"AI 整理成条目和热量，你确认就行；它还能顺口给建议、每周跟你复盘。',
 cost:'依赖 AI 听懂口语和份量，听错了要你改；每次都调用模型，成本最高；不想打字说话的人反而嫌麻烦。',
 fit:'习惯发语音、发文字，嫌点来点去麻烦的人。',
 how:'点下面的示例句子，或者自己输入；看它怎么拆、怎么追问不确定的地方；最后点"这周怎么样"。',
 init:()=>({msgs:[{r:'ai',t:'早上好。今天吃了什么，直接跟我说就行，比如"中午吃了黄焖鸡米饭，饭吃了一半"。'}],eaten:sum(breakfast().map(i=>kc(i.id,i.g)))}),
 render(){if(S.mode==='search')return searchView();return `<div class="chat">${S.msgs.map((m,ix)=>`<div class="msg ${m.r}">${m.t}${m.items?`<div class="parsed">${m.items.map(i=>`<div><span>${FOODS[i.id][0]} · ${i.g} 克</span><span>${kc(i.id,i.g)} 千卡</span></div>`).join('')}</div>${m.done?'<div class="sub">已记下</div>':`<div class="acts"><button class="primary" data-a="ok:${ix}">确认记下</button><button data-a="edit:${ix}">改一下</button></div>`}`:''}${m.search?'<div class="acts"><button class="primary" data-a="csearch">搜索食物库</button></div>':''}${m.ask?`<div class="acts">${m.ask.map(o=>`<button data-a="ans:${o}">${o}</button>`).join('')}</div>`:''}</div>`).join('')}</div>
  <div class="sugg">${['中午吃了黄焖鸡米饭，饭吃了一半','下午一杯拿铁和一个苹果','晚上和朋友吃火锅','这周怎么样'].map(s=>`<button data-a="say:${s}">${s}</button>`).join('')}</div>`},
 dock:()=>S.mode==='search'?'':`<form class="composer" id="composer"><input id="say" placeholder="说说你吃了什么…" autocomplete="off"><button>发送</button></form>`},
plate:{name:'餐盘法',one:'不算热量，看比例。',
 bet:'算热量本身就是放弃的原因：份量估不准、数字看着累。改用手掌记份量（一拳主食、一掌蛋白、一捧蔬菜），反馈是今天的餐盘比例，而不是一个数字。',
 cost:'减重速度难以精确控制；想看热量的人会觉得没依据；和"热量目标"这套逻辑完全不同，选它意味着 PRD 要大改。',
 fit:'讨厌数数字、更想吃得均衡的人。',
 how:'点各类食物的加减号，看餐盘比例和提示怎么变；点"让今天超标"，会加上零食和主食。',
 init:()=>({c:{veg:1,pro:2,carb:2,snack:0}}),
 render(){const c=S.c,goal={veg:4,pro:3,carb:3,snack:1},tot=c.veg+c.pro+c.carb+c.snack,
   segs=[['veg','#8DB07F'],['pro','#C99A6B'],['carb','#E3CB8F'],['snack','#C9C3B6']];let a=0;
   const arcs=tot===0?'':segs.map(([k,col])=>{const f=c[k]/tot;if(!f)return'';const a0=a*2*Math.PI,a1=(a+f)*2*Math.PI;a+=f;
     const big=f>.5?1:0,p=(t,r)=>[60+r*Math.sin(t),60-r*Math.cos(t)];const [x0,y0]=p(a0,50),[x1,y1]=p(a1,50);
     return f>=.999?`<circle cx="60" cy="60" r="50" fill="${col}"/>`:`<path d="M60 60 L${x0} ${y0} A50 50 0 ${big} 1 ${x1} ${y1} Z" fill="${col}"/>`}).join('');
   const tips=[];if(tot===0)tips.push('今天还没记，吃完一餐用手比一比就好');else{if(c.veg<goal.veg)tips.push(`蔬菜还差 ${goal.veg-c.veg} 捧`);if(c.pro<goal.pro)tips.push(`蛋白质还差 ${goal.pro-c.pro} 掌`);
   if(c.carb>goal.carb)tips.push(`主食多了 ${c.carb-goal.carb} 拳，下一餐少一点就好`);if(c.snack>goal.snack)tips.push('零食饮料今天有点多')}
   const names={veg:['蔬菜','捧','两手捧起的量'],pro:['蛋白质','掌','一个手掌大小和厚度'],carb:['主食','拳','一个拳头大小'],snack:['零食饮料','份','一包、一杯']};
   return `<div class="h">今天的餐盘</div><div class="sub">用手掌估份量，不用算热量</div>
   <div class="card plate"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#fff" stroke="#E6E0D3" stroke-width="2"/>${arcs}<circle cx="60" cy="60" r="22" fill="#fff"/></svg>
   <div class="legend">${segs.map(([k,col])=>`<div><i style="background:${col}"></i>${names[k][0]} ${c[k]} / ${goal[k]} ${names[k][1]}</div>`).join('')}</div></div>
   <div class="card" id="plate-tip" style="background:var(--sage-2);border-color:transparent;color:var(--sage)">${tips.length?tips.join('；')+'。':'今天的比例很均衡。'}</div>
   <div class="cats">${Object.keys(names).map(k=>`<div class="cat"><b>${names[k][0]}</b><small>1 ${names[k][1]} ≈ ${names[k][2]}</small><div class="step"><button data-a="dec:${k}">−</button><span>${c[k]} ${names[k][1]}</span><button data-a="inc:${k}">＋</button></div></div>`).join('')}</div>
   <div class="sub" style="margin-top:12px">这周有 4 天比例均衡（模拟数据）</div>`}}
};

// ---------- shared sub-views ----------
function candView(){return `<div class="h">识别结果</div><div class="sub">照片已丢弃 · 逐项确认，没勾选的不会记</div>
  ${S.cands.map((c,ix)=>`<div class="cand"><input type="checkbox" checked data-ix="${ix}"><div class="nm">${FOODS[c.id][0]}<small>估算份量，可修改</small></div><input type="number" value="${c.g}" data-g="${ix}"> 克</div>`).join('')}
  <button class="btn" data-a="confirm">全部记下</button><button class="btn ghost" data-a="home">取消</button>`}
function searchView(){const q=S.q||'';const list=Object.keys(FOODS).filter(id=>!q||FOODS[id][0].includes(q));
  return `<div class="h">记一餐</div>${S.failNote?`<div class="card" style="background:var(--amber-2);border-color:transparent;color:var(--amber)">${S.failNote}</div>`:''}
  <div class="search">🔍<input id="q" value="${q}" placeholder="搜索食物，如 米饭、黄焖鸡（按 / 聚焦）"></div>
  ${list.map(id=>`<div class="food" data-a="add:${id}"><span style="color:var(--ink)">${FOODS[id][0]}</span><span>${FOODS[id][3]} · ${kc(id)} 千卡</span></div>`).join('')||`<div class="empty">没找到"${q}"，可以创建自定义食物（只有你自己能看到）</div>`}
  <button class="btn ghost" data-a="home">返回</button>`}
function weekDetail(){const t=sum(S.log.map(i=>kc(i.id,i.g))),vals=[...PAST,t],rec=vals.filter(v=>v>0),avg=Math.round(sum(rec)/rec.length),over=vals.filter(v=>v>TARGET).length,miss=vals.filter(v=>v===0).length;
  return `<div class="h">近 7 天详情</div><div class="card">${vals.map((v,i)=>`<div class="item"><span>${DAYS[i]}</span><span>${v===0?'未记':v.toLocaleString()+' 千卡'}${v>TARGET?' <span class="chip hi">超出 '+(v-TARGET)+'</span>':''}</span></div>`).join('')}</div>
  <div class="card" id="week-msg" style="background:var(--sage-2);border-color:transparent;color:var(--sage)">${avg<=TARGET?`这周有 ${over} 天超过目标，但平均仍在目标内，这周在轨道上。${miss?miss+' 天没记，平均只按记录的 '+(7-miss)+' 天算。':''}`:`平均比目标高 ${avg-TARGET} 千卡。接下来几天每天少吃一点，就能把平均拉回来。`}</div>
  <button class="btn ghost" data-a="home">返回</button>`}
function habitQuick(){return `<div class="h">记${MEALNAME[S.meal]}</div><div class="sub">点一下就记下，份量用常用的</div>
  ${['hmj','rice','nrm','mlt','chicken','greens','latte','apple','yogurt'].map(id=>`<div class="food" data-a="hadd:${id}"><span style="color:var(--ink)">${FOODS[id][0]}</span><span>${FOODS[id][3]}</span></div>`).join('')}
  <button class="btn ghost" data-a="home">返回</button>`}

// ---------- chat: simulated parser ----------
function parse(text){const items=[];const rules=[['黄焖鸡','hmj'],['米饭','rice'],['饭','rice'],['拿铁','latte'],['咖啡','latte'],['苹果','apple'],['牛肉面','nrm'],['麻辣烫','mlt'],['酸奶','yogurt'],['鸡蛋','egg'],['奶茶','tea']];
  for(const [k,id] of rules){if(text.includes(k)&&!items.find(i=>i.id===id)){let g=FOODS[id][2];if(id==='rice'&&/饭.{0,4}一半/.test(text))g=Math.round(g/2);items.push({id,g})}}
  return items}
function chatSay(text){S.msgs.push({r:'me',t:text});
  if(text.includes('这周')){const avg=Math.round(sum(PAST.filter(v=>v>0).concat(S.eaten))/6);
    S.msgs.push({r:'ai',t:`这周你记了 6 天，周一忘了记也没关系。平均每天 ${avg.toLocaleString()} 千卡，比目标低一点，在轨道上。周六聚餐那天多了 430 千卡，周日就拉回来了，这是最好的做法。下周可以试试午饭多加一份蔬菜。`});return}
  if(text.includes('火锅')){S.msgs.push({r:'ai',t:'火锅差别很大。大概吃了哪些？选一个最接近的，之后还能改。',ask:['以肉为主','肉菜各半','以蔬菜和粉为主']});return}
  if(failMode){S.msgs.push({r:'ai',t:'AI 暂时没有响应（超过 10 秒）。先用搜索记下这一餐吧，你刚说的话还在，稍后可以再发。',search:true});return}
  const items=parse(text);
  if(!items.length){S.msgs.push({r:'ai',t:'没认出具体的食物。可以说得具体一点，比如"一碗牛肉面"。'});return}
  S.msgs.push({r:'ai',t:'我理解的是这些，对吗？',items})}

// ---------- rendering and events ----------
function render(){const d=DIRS[D];$('view').innerHTML=d.render();$('dock').innerHTML=d.dock?d.dock():'';
  const f=$('composer');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('say').value.trim();if(v){chatSay(v);render();scrollEnd()}};
  const q=$('q');if(q)q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(pos,pos)}}
function scrollEnd(){const v=$('view');v.scrollTop=v.scrollHeight}
$('view').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [a,arg]=el.dataset.a.split(/:(.+)/);
  if(a==='home'){S.mode='home';S.q='';S.failNote=null}
  if(a==='snap'){S.t0=Date.now();if(failMode){S.mode='search';S.failNote='没认出这张照片里的食物（可能太暗或被挡住了）。直接搜一下，或者回去点常吃。'}else{S.mode='cand';S.cands=[{id:'hmj',g:300},{id:'rice',g:200},{id:'greens',g:150}]}}
  if(a==='confirm'){let n=0;document.querySelectorAll('.cand').forEach(r=>{const cb=r.querySelector('[type=checkbox]');if(cb.checked){S.log.push({id:S.cands[+cb.dataset.ix].id,g:+r.querySelector('[type=number]').value||0});n++}});
    const sec=Math.max(4,Math.round((Date.now()-(S.t0||Date.now()))/1000));S.mode='home';render();toast(`记下 ${n} 样，这一餐用时约 ${sec} 秒`);return}
  if(a==='quick'){S.log.push({id:arg,g:FOODS[arg][2]});render();toast(`已记下：${FOODS[arg][0]}`);return}
  if(a==='del'){S.log.splice(+arg,1)}
  if(a==='search'){S.mode='search';S.q=''}
  if(a==='detail'){S.mode='detail'}
  if(a==='csearch'){S.mode='search';S.q='';S.failNote='AI 暂时没有响应，先搜索记下这一餐。'}
  if(a==='add'&&D==='chat'){S.eaten+=kc(arg);S.mode='home';S.failNote=null;const left=TARGET-S.eaten;
    S.msgs.push({r:'ai',t:`用搜索记下了：${FOODS[arg][0]}。今天已吃 ${S.eaten.toLocaleString()} 千卡，${left>=0?'还能吃 '+left.toLocaleString():'比目标多 '+(-left).toLocaleString()+'，按一周来看就好'}。`});render();scrollEnd();return}
  if(a==='add'){S.log.push({id:arg,g:FOODS[arg][2]});S.mode='home';S.failNote=null;render();toast(`已记下：${FOODS[arg][0]}`);return}
  if(a==='meal'){S.mode='quick';S.meal=arg}
  if(a==='hadd'){S.log[S.meal].push({id:arg,g:FOODS[arg][2]});S.mode='home';render();toast('记下了，今天又坚持了一餐');return}
  if(a==='say'){chatSay(arg);render();scrollEnd();return}
  if(a==='ok'){const m=S.msgs[+arg];m.done=true;S.eaten+=sum(m.items.map(i=>kc(i.id,i.g)));const left=TARGET-S.eaten;
    S.msgs.push({r:'ai',t:`记下了。今天已吃 ${S.eaten.toLocaleString()} 千卡，${left>=0?'还能吃 '+left.toLocaleString():'比目标多 '+(-left).toLocaleString()+'，按一周来看就好'}。`});render();scrollEnd();return}
  if(a==='edit'){S.msgs.push({r:'ai',t:'哪里不对？直接说就行，比如"饭吃完了"或者"没有青菜"。'});render();scrollEnd();return}
  if(a==='ans'){const g={'以肉为主':900,'肉菜各半':700,'以蔬菜和粉为主':550}[arg];S.msgs.push({r:'me',t:arg},{r:'ai',t:'按这个估算，有出入随时改：',items:[{id:'hotpot',g}]});render();scrollEnd();return}
  if(a==='inc'){S.c[arg]++}
  if(a==='dec'){S.c[arg]=Math.max(0,S.c[arg]-1)}
  render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&$('q')&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}
  if(e.key==='Escape'&&S.mode&&S.mode!=='home'){S.mode='home';S.failNote=null;render()}});

function setDir(d,keepUrl){D=d;S=DIRS[d].init();const x=DIRS[d],keys=Object.keys(DIRS);
  $('thesis').innerHTML=`<div class="sub">方向 ${keys.indexOf(d)+1} / ${keys.length}${picked===d?' · 已选':''}</div><h2>${x.name}</h2><div class="one">${x.one}</div>
   <dl><dt>押注</dt><dd>${x.bet}</dd><dt>代价</dt><dd>${x.cost}</dd><dt>适合谁</dt><dd>${x.fit}</dd></dl><div class="how">怎么试：${x.how}</div>`;
  $('switch').innerHTML=keys.map((k,i)=>`<button data-d="${k}" class="${k===d?'on':''} ${k===picked?'picked':''}">${i+1} ${DIRS[k].name}</button>`).join('');
  $('c-pick').textContent=picked===d?'已选这个方向（再点取消）':'选这个方向';
  if(!keepUrl)history.replaceState(null,'','?d='+d);render()}
$('switch').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)setDir(b.dataset.d)});
$('ctrl').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
  if(c==='reset'){setDir(D);return}
  if(c==='empty'){if(D==='habit')S.log={breakfast:[],lunch:[],dinner:[],snack:[]};else if(D==='plate')S.c={veg:0,pro:0,carb:0,snack:0};else if(D==='chat'){S.msgs=S.msgs.slice(0,1);S.eaten=0}else S.log=[];S.mode='home'}
  if(c==='over'){if(D==='plate'){S.c.carb+=2;S.c.snack+=2}else if(D==='habit'){S.log.dinner=[{id:'hotpot',g:900}];S.log.snack=[{id:'tea',g:500}]}
    else if(D==='chat'){S.eaten+=1300;S.msgs.push({r:'ai',t:'今天已吃 '+S.eaten.toLocaleString()+' 千卡，比目标多了一些。没关系，按一周来看就好，明天正常吃。'})}else S.log.push({id:'hotpot',g:900},{id:'tea',g:500});S.mode='home'}
  if(c==='fail'){failMode=!failMode;b.classList.toggle('on',failMode);b.textContent='识别失败模式：'+(failMode?'开':'关');return}
  if(c==='pick'){picked=picked===D?null:D;const keep=S;setDir(D,true);S=keep;render();toast(picked?`已选：${DIRS[D].name}`:'已取消选择');return}
  if(c==='copy'){$('prompt-out').value=`食衡方向原型反馈\n- 正在看的方向：${DIRS[D].name}（${DIRS[D].one}）\n- 已选方向：${picked?DIRS[picked].name:'还没选'}\n- 识别失败模式：${failMode?'开':'关'}\n- 想混搭的部分：（例如"极速记录的拍照 + 宽容回顾的反馈"）\n- 我的判断：（哪里对、哪里不对、要改什么）`;$('modal').classList.add('on');$('prompt-out').select();return}
  render()});
$('m-close').onclick=()=>$('modal').classList.remove('on');
$('m-copy').onclick=()=>{$('prompt-out').select();try{navigator.clipboard.writeText($('prompt-out').value)}catch(e){}document.execCommand&&document.execCommand('copy');$('m-copy').textContent='已复制';setTimeout(()=>$('m-copy').textContent='复制',1500)};
const first=new URLSearchParams(location.search).get('d');setDir(DIRS[first]?first:'chat',true);
</script>
</body>
