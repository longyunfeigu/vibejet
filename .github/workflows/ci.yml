name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv --version

      - name: Verify uv.lock is up-to-date
        run: uv lock --check

      # 装上全部可选扩展：可选适配器（gRPC、Kafka、存储、可观测性等）的测试才会真跑，而不是被 skip
      - name: Install dependencies (locked)
        run: uv sync --all-extras --locked

      # DDD 依赖方向契约必须全量跑（import 图检查不适用 changed-files 策略）
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports

      # 复杂度全量检查：下面的 lint 只看改动过的文件，没人碰的老函数超标会一直藏着；这一步看整个后端
      - name: Complexity (whole backend)
        run: uv run flake8 --select C901 .

      - name: Audit dependencies
        run: |
          uv export --no-emit-project --no-dev --all-extras -o /tmp/requirements-audit.txt
          uv run pip-audit -r /tmp/requirements-audit.txt

      # --diff-filter=d：删除的文件不进清单，否则 black 等工具会因路径不存在而直接报错
      - name: Detect changed Python files
        id: changed-py
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            PY_FILES="$(
              git -C "${GITHUB_WORKSPACE}" ls-files 'backend/*.py' \
                | sed -e 's|^backend/||' \
                      -e '/^alembic\/versions\//d' \
                      -e '/^grpc_app\/generated\//d'
            )"
          else
            PY_FILES="$(
              git -C "${GITHUB_WORKSPACE}" diff --name-only --diff-filter=d "${BASE_SHA}" HEAD -- 'backend/*.py' \
                | sed -e 's|^backend/||' \
                      -e '/^alembic\/versions\//d' \
                      -e '/^grpc_app\/generated\//d'
            )"
          fi

          {
            echo "files<<EOF"
            echo "${PY_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Lint & Security (changed files)
        if: steps.changed-py.outputs.files != ''
        shell: bash
        run: |
          mapfile -t PY_FILES < <(printf '%s\n' "${{ steps.changed-py.outputs.files }}" | sed '/^$/d')
          uv run black --check "${PY_FILES[@]}"
          uv run isort --check-only "${PY_FILES[@]}"
          uv run flake8 --max-line-length=100 --extend-ignore=E203,E501,W503,B008 "${PY_FILES[@]}"
          # silent：跟随导入做类型推断但只报改动文件的错（skip 会把导入全当 Any，满屏误报）。
          # tests/ 不跑 mypy：测试里的假对象按结构写，不按严格类型写
          mapfile -t MYPY_FILES < <(printf '%s\n' "${PY_FILES[@]}" | sed '/^tests\//d')
          if (( ${#MYPY_FILES[@]} )); then
            uv run mypy --explicit-package-bases --follow-imports=silent "${MYPY_FILES[@]}"
          fi
          uv run bandit -c pyproject.toml -s B104,B108 "${PY_FILES[@]}"

      - name: Lint skipped
        if: steps.changed-py.outputs.files == ''
        run: echo "No Python file changes detected; skipping lint/security."

      # SECRET_KEY 由 tests/conftest.py 的 setdefault 兜底（该值能通过弱值/长度校验）；
      # 此处不要显式传 test-secret-key 之类的弱值——会被 Settings 校验拒绝导致收集失败
      - name: Test
        run: uv run pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  autotest-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoTest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AutoTest/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      # 验证指导（Release-Check）lint 及其单测、runner 单测、BDD 规范、类型检查、步骤匹配。
      # 端到端用例需要运行中的前后端，不在 CI 跑（见 AutoTest/AGENTS.md「前置」）。
      - name: Release-Check lint unit tests
        run: npm run test:release-check

      - name: Release-Check guides lint
        run: npm run lint:release-check

      - name: Runner unit tests
        run: npm run test:runner

      - name: BDD lint
        run: npm run lint:bdd

      - name: Typecheck
        run: npm run typecheck

      # bddgen 只加载配置、不跑 global-setup；给出占位环境变量即可校验每个步骤都有定义
      - name: BDD step matching (bddgen)
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_USERNAME: e2e-fixture-user-a
          E2E_PASSWORD: not-used-by-bddgen
        run: npm run bdd:gen

  duplication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 重复代码门禁：后端 + 前端源码的重复行超过 3% 即失败（2026-11-09 基线 2.09%）
      - name: Copy-paste duplication (jscpd)
        run: >-
          npx -y jscpd@4.0.5 backend frontend/src
          --format python,typescript,tsx --min-lines 6 --min-tokens 60 --threshold 3
          --ignore "**/.venv/**,**/tests/**,**/alembic/versions/**,**/grpc_app/generated/**,**/node_modules/**,**/__pycache__/**"
          --reporters console

  # 真实 broker 上的 Kafka 集成测试：单测只用假客户端，只有这里能证明 aiokafka 适配器真的能连、能发、能收
  kafka-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (locked)
        run: uv sync --extra dev --extra aiokafka --locked

      - name: Kafka integration tests (real broker)
        env:
          KAFKA_INTEGRATION_BOOTSTRAP: localhost:9092
        run: uv run pytest tests/test_kafka_integration.py -v
